# Netlify configuration for the UpSkills Hub frontend (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- API proxy -------------------------------------------------------------
# Forwards every /api request to the live backend so the frontend can keep
# calling "/api" (no CORS, same-origin). Replace the target host below with
# your real backend URL, then redeploy.
[[redirects]]
  from = "/api/*"
  to = "https://upskills-web-backend.onrender.com/api/:splat"
  status = 200
  force = true

# --- SPA fallback ----------------------------------------------------------
# React Router handles routing client-side, so every other path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
